# Toolchain pins. Every name below exists in the mise registry (the previous file named 13 that did not, so
# mise warned on every shell entry while installing none of them, and listed Node/npm/yarn/pnpm/Bun/vitest/jest —
# i.e. contradicted the repo's own runtime policy).  CI pins the same versions (.github/workflows/test.yml).

[tools]
bun = "1.4.2"       # the estate JS runtime, test runner and package manager (Deno retired 2026-09-22)
just = "latest"     # task runner (Justfile)
zig = "0.15.2"      # the exact Zig that Gossamer requires (ffi/zig, future native sim host)
rust = "latest"     # tray/ (ksni)
shellcheck = "latest"

# No [alias]/[tasks]: the estate drives builds through the Justfile; a second task runner sharing the verbs
# build/test/lint is worse than one. Use `just <recipe>`.
