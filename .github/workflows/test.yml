# SPDX-License-Identifier: AGPL-3.0-or-later
# This workflow is managed by gh actions-lock.
# Test suite — Bun (the estate runtime; Deno was retired by LANGUAGE-POLICY, owner ruling 2026-09-22)
# on Linux + macOS.  The suite boots the REAL engine headlessly (test/harness/) — see docs/TESTING.adoc.
name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Run test suite
        run: bun test

      - name: Run benchmarks (real engine, not a stand-in)
        run: bun run bench

      - name: Coverage report
        run: bun test --coverage

  lint:
    name: Static guards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Every tracked .js file parses
        run: |
          fail=0
          for f in $(git ls-files '*.js'); do
            case "$f" in archive/*) continue ;; esac
            if ! bun build --no-bundle "$f" > /dev/null 2> /tmp/err.txt; then
              echo "::error file=$f::does not parse"; cat /tmp/err.txt; fail=1
            fi
          done
          exit $fail

      - name: Verify coordination.k9 starts with magic number
        run: |
          head -1 coordination.k9 | grep -q "^K9!" || { echo "FAIL - coordination.k9 missing K9! magic"; exit 1; }

      - name: Verify no TypeScript files
        run: |
          TS_FILES=$(git ls-files '*.ts' '*.tsx' || true)
          if [ -n "$TS_FILES" ]; then
            echo "FAIL: TypeScript files found:"; echo "$TS_FILES"; exit 1
          fi

      - name: Root shape matches the allowlist (RSR check-root-shape)
        run: bash scripts/check-root-shape.sh .
