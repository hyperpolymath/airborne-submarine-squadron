# SPDX-License-Identifier: AGPL-3.0-or-later
# This workflow is managed by gh actions-lock.
# AffineScript / WASM build-chain gate.
#
#  vectors      (BLOCKING) the JS reference twin and its golden vectors are in sync, and the verifier
#               rejects the known-bad legacy artifact.  Pure Bun; no compiler needed.
#  no-compiler  (BLOCKING) build.sh must exit 0 with a clear note when no compiler exists: the WASM
#               co-processor is optional, the game must always build/play without it.
#  compile      (ADVISORY) fetch the upstream AffineScript compiler, compile src/main.affine to core
#               WASM and run the conformance verifier on the result.  Advisory because the compiler is
#               alpha (see hyperpolymath/affinescript docs/CAPABILITY-MATRIX.adoc); its JOB LOG is the
#               evidence of whether the AffineScript core currently compiles to something that matches
#               the reference.  Flip to blocking once it is green.
name: Build Chain

on:
  push:
    branches: [ main ]
    paths:
      - build.sh
      - run.js
      - src/**
      - sim/**
      - test/wasm_artifact_test.js
      - '.github/workflows/build-chain.yml'
  pull_request:
    branches: [ main ]
    paths:
      - build.sh
      - run.js
      - src/**
      - sim/**
      - test/wasm_artifact_test.js
      - '.github/workflows/build-chain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vectors:
    name: Reference twin + golden vectors
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Golden vectors are current
        run: bun run vectors:check
      - name: Twin, verifier and legacy-artifact negative control
        run: bun test test/wasm_artifact_test.js

  no-compiler:
    name: build.sh without a compiler exits 0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Verify affinescript is NOT on PATH
        run: |
          if command -v affinescript >/dev/null 2>&1; then echo "::error::affinescript unexpectedly present"; exit 1; fi
      - name: build.sh must succeed and say why it skipped
        env:
          AFFINESCRIPT_REPO: ""
        run: |
          out=$(bash build.sh)
          echo "$out"
          echo "$out" | grep -q "affinescript not found" || { echo "::error::build.sh must document the 'affinescript not found' path"; exit 1; }
      - name: build.sh documents both discovery paths
        run: |
          grep -q 'AFFINESCRIPT_REPO' build.sh || { echo "::error::build.sh must reference AFFINESCRIPT_REPO"; exit 1; }
          grep -q -- '--wasm-gc' build.sh && grep -v '^#' build.sh | grep -q -- '--wasm-gc' && { echo "::error::build.sh must NOT pass --wasm-gc (the JS loader needs linear memory)"; exit 1; } || true

  compile:
    name: Compile src/main.affine + verify (ADVISORY)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Fetch the latest published AffineScript compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/bin"
          tag=$(gh release list -R hyperpolymath/affinescript --limit 20 --json tagName,assets -q '[.[] | select(.assets | length > 0)][0].tagName')
          echo "using affinescript release: ${tag:-<none with assets>}"
          [ -n "$tag" ] || { echo "::warning::no affinescript release with binaries; cannot compile"; exit 1; }
          gh release download "$tag" -R hyperpolymath/affinescript -p 'affinescript-linux-x64' -D "$HOME/bin"
          mv "$HOME/bin/affinescript-linux-x64" "$HOME/bin/affinescript" && chmod +x "$HOME/bin/affinescript"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/affinescript" --help | head -40 || true
      - name: Type-check (typed-wasm ownership verifier runs as part of compile)
        run: affinescript check src/main.affine
      - name: Compile to core WASM and verify against the reference twin
        run: bash build.sh
      - name: The artifact, if any, must pass the conformance verifier on its own
        if: always()
        run: |
          if [ -f build/airborne-submarine-squadron.wasm ]; then bun run sim/verify_artifact.js build/airborne-submarine-squadron.wasm
          else echo "no artifact was produced (see compile step)"; exit 1; fi
