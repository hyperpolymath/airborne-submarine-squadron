# SPDX-License-Identifier: AGPL-3.0-or-later
# This workflow is managed by gh actions-lock.
# Prevention workflow - validates all workflows have proper security config
name: Workflow Security Linter

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    paths:
      - '.github/workflows/**'

permissions: read-all

jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check SPDX headers
        run: |
          # The SPDX id must be in the LEADING comment block, not necessarily line 1 (gh actions-lock
          # prepends its own "managed by" comment; checking `head -1` failed every lock-managed file).
          errors=0
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            if ! awk '/^---[[:space:]]*$/ { next } /^#/ { print; next } { exit }' "$f" | grep -q "^# SPDX-License-Identifier:"; then
              echo "ERROR: $f missing SPDX header"
              errors=$((errors + 1))
            fi
          done
          exit $errors

      - name: Check permissions declaration
        run: |
          errors=0
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            if ! grep -q "^permissions:" "$f"; then
              echo "ERROR: $f missing permissions declaration"
              errors=$((errors + 1))
            fi
          done
          exit $errors

      - name: Check pinned actions (direct refs must be full commit SHAs)
        run: |
          # Mirrors the governance gate: every direct `uses:` (except local ./, docker:// and the
          # estate's own reusable workflows, which are SHA-pinned separately) must be @<40 hex>.
          unpinned=$(grep -rnE --include='*.yml' --include='*.yaml' "^[[:space:]]+(- )?uses:" .github/workflows/ \
            | grep -v "@[a-f0-9]\{40\}" | grep -v "uses: \./\|uses: docker://" || true)
          if [ -n "$unpinned" ]; then
            echo "ERROR: direct workflow references not SHA-pinned:"; echo "$unpinned"; exit 1
          fi
          echo "all direct references are SHA-pinned"
